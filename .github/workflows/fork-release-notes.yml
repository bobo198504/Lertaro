name: Fork Release Notes

# This fork keeps its own release notes in CHANGELOG.md (Chinese, English, then the hashes; newest first).
# Upstream's "Build and Release" workflow owns the release and writes its own body, so this workflow runs
# AFTER it finishes and writes the fork's notes as the LAST writer -- one pass, no manual correction.
# No upstream file is touched, and the hashes always come from THIS release's own assets.

on:
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]
  # Manual run: for testing this workflow, or re-writing the notes without publishing a new version.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to write the notes for (e.g. v5.8.5.1)
        required: true

permissions:
  contents: write

jobs:
  write-notes:
    # A failed build must not touch the notes; a manual run has no conclusion to check.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    steps:
      - name: Resolve the tag
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # An explicit input wins. Otherwise the run's branch -- a tag name for a tag push, though that is
          # not guaranteed, so anything that does not look like a version falls back to the newest release.
          $tag = $env:INPUT_TAG
          if (-not $tag) { $tag = $env:RUN_BRANCH }
          if (-not $tag -or $tag -notmatch '^v[0-9]') {
            $tag = (gh release list --limit 1 --json tagName --jq '.[0].tagName')
          }
          if (-not $tag) { Write-Error 'No tag could be resolved.'; exit 1 }
          Write-Host "tag: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1

      - name: Write the release body from CHANGELOG.md
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $cl = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $heading = "## $env:TAG"
          $i = $cl.IndexOf($heading)
          if ($i -lt 0) {
            Write-Host "CHANGELOG.md has no '$heading' entry; leaving the release body alone."
            exit 0
          }

          # The entry runs from its heading to the next version heading.
          $rest = $cl.Substring($i)
          $next = [regex]::Match($rest.Substring($heading.Length), '(?m)^## v[0-9.]+')
          $entry = if ($next.Success) { $rest.Substring(0, $heading.Length + $next.Index) } else { $rest }
          # Drop the version heading itself: the release page already shows the version.
          $entry = $entry.Substring($heading.Length).Trim()

          # Hashes from THIS release's own assets (never upstream's); the .sig files are not listed.
          $assets = gh release view $env:TAG --json assets | ConvertFrom-Json
          $lines = @($entry, '', '## SHA-256 Checksums', '', '```')
          foreach ($a in $assets.assets) {
            if ($a.name -like '*.sig') { continue }
            $hash = $a.digest -replace '^sha256:', ''
            if (-not $hash) { continue }
            $lines += ('  ' + $a.name.PadRight(28) + $hash)
          }
          $lines += '```'

          $out = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($out, ($lines -join "`n"), (New-Object System.Text.UTF8Encoding($false)))
          gh release edit $env:TAG --notes-file $out
          Write-Host "Release body written from CHANGELOG.md (one pass)."
